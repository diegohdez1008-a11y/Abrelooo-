<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff3b0">
  <title>Para ti 💛</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.75), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(255,238,150,.45), transparent 30%),
        #fff4b8;
      color: #5f4d12;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .page {
      width: min(100%, 520px);
      min-height: 100vh;
      padding: 34px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,.28);
      filter: blur(25px);
      pointer-events: none;
    }

    .bouquet {
      width: min(88vw, 420px);
      max-height: 58vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 18px rgba(102, 79, 5, .16));
      animation: float 4s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    .message {
      margin: 8px 0 22px;
      max-width: 430px;
      text-align: center;
      font-family: "Bradley Hand", "Segoe Print", cursive;
      font-size: clamp(18px, 4.8vw, 25px);
      line-height: 1.55;
      letter-spacing: .2px;
    }

    .heart {
      display: inline-block;
      animation: beat 1.5s ease-in-out infinite;
    }

    .player {
      width: min(100%, 390px);
      padding: 16px 18px;
      border: 1px solid rgba(113, 91, 15, .10);
      border-radius: 24px;
      background: rgba(255,255,255,.42);
      box-shadow: 0 12px 35px rgba(112, 91, 15, .10);
      backdrop-filter: blur(12px);
    }

    .song {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .cover {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(145deg, #f7c928, #ffeaa0);
      display: grid;
      place-items: center;
      font-size: 25px;
      box-shadow: 0 5px 14px rgba(100,75,0,.13);
    }

    .song b { display:block; font-size: 16px; }
    .song span { font-size: 13px; opacity: .72; }

    input[type="range"] {
      width: 100%;
      accent-color: #b89416;
      cursor: pointer;
    }

    .times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: .65;
      margin-top: -4px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-top: 7px;
    }

    button {
      border: 0;
      background: transparent;
      color: #66520e;
      cursor: pointer;
      font-size: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    #play {
      background: rgba(255,255,255,.7);
      box-shadow: 0 5px 14px rgba(95,76,10,.10);
      font-size: 20px;
    }

    .hint {
      margin-top: 15px;
      font-size: 11px;
      opacity: .5;
      text-align: center;
    }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-.4deg); }
      50% { transform: translateY(-7px) rotate(.4deg); }
    }
    @keyframes beat {
      0%,100% { transform: scale(1); }
      15% { transform: scale(1.16); }
      30% { transform: scale(1); }
    }

    @media (max-height: 720px) {
      .page { padding-top: 20px; }
      .bouquet { max-height: 48vh; }
      .message { margin-bottom: 14px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="glow"></div>

    <img class="bouquet" src="assets/flores.png" alt="Flores amarillas">

    <p class="message">
      Mi niña sé que no podemos vernos y no puedo darte flores,
      pero no quería que fueras espectadora este día.
      Te amo mucho <span class="heart">💛</span>
    </p>

    <section class="player" aria-label="Reproductor de música">
      <div class="song">
        <div class="cover">🌻</div>
        <div>
          <b>Amor</b>
          <span>Emanuel Cortés</span>
        </div>
      </div>

      <input id="progress" type="range" min="0" max="100" value="0" aria-label="Progreso">

      <div class="times">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="back" aria-label="Retroceder 10 segundos">↶</button>
        <button id="play" aria-label="Reproducir">▶</button>
        <button id="forward" aria-label="Avanzar 10 segundos">↷</button>
      </div>
    </section>

    <div class="hint">Hecho especialmente para ti 💛</div>
    <audio id="audio" src="assets/amor.mp3" preload="metadata"></audio>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const play = document.getElementById("play");
    const progress = document.getElementById("progress");
    const current = document.getElementById("current");
    const duration = document.getElementById("duration");

    const fmt = s => {
      if (!Number.isFinite(s)) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, "0");
      return `${m}:${sec}`;
    };

    play.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
          play.textContent = "Ⅱ";
        } catch {
          alert("Toca otra vez el botón para iniciar la canción 💛");
        }
      } else {
        audio.pause();
        play.textContent = "▶";
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = fmt(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      current.textContent = fmt(audio.currentTime);
      progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    });

    progress.addEventListener("input", () => {
      if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
    });

    document.getElementById("back").addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    document.getElementById("forward").addEventListener("click", () => {
      audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + 10);
    });

    audio.addEventListener("ended", () => {
      play.textContent = "▶";
      progress.value = 0;
    });
  </script>
</body>
</html>
